<!-- Translation result view — returned via SSE "ready" event -->

<link rel="stylesheet" href="/static/results.css">

<section class="translate-results">
  <div class="trans-header">
    <h2 class="trans-title">Translations</h2>
    <span class="plan-badge running" id="trans-status-badge" role="status">{{ languages_with_ids | length }} translation{{ 's' if languages_with_ids | length != 1 else '' }} in progress</span>
  </div>

  <div class="trans-row{% if languages_with_ids | length == 1 %} trans-row--single{% endif %}" id="trans-row">
    {% for language, template_id in languages_with_ids %}
    <div
      class="trans-col"
      data-template-id="{{ template_id }}"
      hx-ext="sse"
      sse-connect="/stream-translate/{{ template_id }}?language={{ language | urlencode }}&amp;model={{ llm_model | urlencode }}"
      sse-close="close"
    >
      <div class="trans-col-header">
        <div class="trans-col-info">
          <span class="trans-col-label">Language</span>
          <span class="trans-col-lang">{{ language }}</span>
        </div>
        <div class="col-header-actions">
          <span class="trans-status translating">
            <span class="status-dot" aria-hidden="true"></span>Translating&hellip;
          </span>
          <div class="col-dl-bar" hidden>
            <a href="/download-html/{{ template_id }}"
               download="email-{{ template_id[:8] }}.html"
               class="btn-download"
               aria-label="Download {{ language }} version as HTML">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path d="M7 1v8m0 0L4 6m3 3 3-3M1 11h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>HTML
            </a>
            <a href="/download-template/{{ template_id }}"
               download="email-{{ template_id[:8] }}.json"
               class="btn-download"
               aria-label="Download {{ language }} version as JSON">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path d="M7 1v8m0 0L4 6m3 3 3-3M1 11h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>JSON
            </a>
          </div>
        </div>
      </div>

      <div class="trans-iframe-wrap" sse-swap="preview" hx-swap="innerHTML">
        <div class="trans-placeholder">Waiting for the first preview&hellip;</div>
      </div>
      <div class="agent-error-panel" sse-swap="agent-error" hx-swap="innerHTML"></div>
      <div class="sequence-warning" sse-swap="validation-warning" hx-swap="innerHTML" role="status"></div>
    </div>
    {% endfor %}
  </div>
</section>

<script>
(function () {
  var results = document.currentScript.previousElementSibling;
  var columns = Array.from(results.querySelectorAll('.trans-col'));
  var RUNNING = 'is-translating';

  function ownColumn(el) {
    var col = el && el.closest && el.closest('.trans-col');
    return col && results.contains(col) ? col : null;
  }

  /* ── Scale each 700px preview to its column's actual width ── */
  function scaleWrap(col) {
    var wrap = col.querySelector('.trans-iframe-wrap');
    if (!wrap) return;
    if (!wrap.querySelector('iframe')) {
      wrap.style.transform = '';
      wrap.style.height = '';
      return;
    }
    var scale = col.clientWidth / 700;
    wrap.style.transform = 'scale(' + scale + ')';
    wrap.style.height = (800 * scale) + 'px';
  }
  if (window.ResizeObserver) {
    var resizer = new ResizeObserver(function (entries) {
      entries.forEach(function (entry) { scaleWrap(entry.target); });
    });
    columns.forEach(function (col) { resizer.observe(col); });
  } else {
    window.addEventListener('resize', function () { columns.forEach(scaleWrap); });
  }

  /* ── Status transitions (outcome event: completed | needs_review | failed) ── */
  var STATES = {
    completed:    { col: 'is-done',   pill: 'done',   text: 'Done' },
    needs_review: { col: 'is-review', pill: 'review', text: 'Needs review' },
    failed:       { col: 'is-error',  pill: 'error',  text: 'Failed' }
  };

  function setPill(col, outcome, text) {
    var state = STATES[outcome];
    col.classList.remove(RUNNING, 'is-done', 'is-review', 'is-error');
    col.classList.add(state.col);
    var pill = col.querySelector('.trans-status');
    pill.className = 'trans-status ' + state.pill;
    pill.textContent = text || state.text;
  }

  function settle(col, outcome, text) {
    col.dataset.outcome = outcome;
    setPill(col, outcome, text);
    col.querySelector('.col-dl-bar').hidden = outcome === 'failed';
    var warning = col.querySelector('.sequence-warning');
    if (outcome === 'completed') warning.textContent = '';
    else if (outcome === 'needs_review' && !warning.textContent.trim()) {
      warning.textContent = 'This translation finished with a warning. You can still download it.';
    }
    updateSummary();
  }

  // Never reconnect: a reconnect would start a second, paid run for the same column.
  function stopStream(col, source) {
    col.removeAttribute('sse-connect');
    if (source) source.close();
  }

  function markStopped(col, message) {
    settle(col, 'failed', 'Stopped');
    col.querySelector('.agent-error-panel').textContent = message;
  }

  function updateSummary() {
    var settled = columns.filter(function (col) { return col.dataset.outcome; });
    var count = function (o) { return settled.filter(function (c) { return c.dataset.outcome === o; }).length; };
    var done = count('completed'), reviews = count('needs_review'), failed = count('failed');
    var running = columns.length - settled.length;
    var parts = [done + ' done'];
    if (reviews) parts.push(reviews + (reviews === 1 ? ' needs review' : ' need review'));
    if (failed) parts.push(failed + ' failed');
    if (running) parts.push(running + ' in progress');
    var badge = results.querySelector('#trans-status-badge');
    badge.textContent = parts.join(', ');
    badge.className = 'plan-badge' + (running ? ' running' : failed ? '' : ' done');
  }

  document.body.addEventListener('htmx:sseMessage', function (e) {
    var col = ownColumn(e.target);
    if (!col) return;
    var kind = e.target.getAttribute('sse-swap');
    if (kind === 'validation-warning') return;
    if (kind === 'agent-error') {
      if (!col.dataset.outcome) setPill(col, 'failed');
      return;
    }
    scaleWrap(col);
    var wrap = col.querySelector('.trans-iframe-wrap');
    if (!wrap) return;
    wrap.classList.remove('preview-refreshing');
    void wrap.offsetWidth;
    wrap.classList.add('preview-refreshing');
    wrap.addEventListener('animationend', function () {
      wrap.classList.remove('preview-refreshing');
    }, { once: true });
  });

  document.body.addEventListener('htmx:sseOpen', function (e) {
    var col = ownColumn(e.target);
    if (!col || col.dataset.outcome) return;
    col.classList.add(RUNNING);
    e.detail.source.addEventListener('outcome', function (event) {
      var outcome;
      try { outcome = JSON.parse(event.data).status; } catch (_) { return; }
      if (STATES[outcome]) settle(col, outcome);
    });
  });

  document.body.addEventListener('htmx:sseError', function (e) {
    var col = ownColumn(e.target);
    if (!col) return;
    stopStream(col, e.detail && e.detail.source);
    if (col.dataset.outcome) return;
    markStopped(col, 'The live connection dropped before this translation finished. It was not restarted, so it may be incomplete.');
  });

  document.body.addEventListener('htmx:sseClose', function (e) {
    var col = ownColumn(e.target);
    if (!col) return;
    stopStream(col, null);
    if (e.detail.type !== 'message' || col.dataset.outcome) return;
    markStopped(col, 'This translation stopped before it finished.');
  });
})();
</script>
